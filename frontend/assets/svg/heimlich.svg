<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgHeim)"/>

  <!-- Rescuer body (standing behind) -->
  <path d="M 90 280 L 110 110 C 130 90, 210 90, 230 110 L 250 280 Z" fill="#1e3a8a" opacity="0.6"/>

  <!-- Victim torso (standing in front, leaning slightly forward) -->
  <path d="M 140 280 C 150 170, 160 130, 260 130 C 290 130, 310 170, 320 280 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <!-- Victim head bent forward -->
  <circle cx="280" cy="90" r="32" fill="#475569"/>

  <!-- Navel & Rib margin anatomical landmarks -->
  <circle cx="215" cy="225" r="5" fill="#94a3b8"/>
  <text x="215" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Пупок</text>

  <!-- Rescuer's arms wrapping around -->
  <path d="M 120 160 C 120 185, 170 195, 210 190" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 280 160 C 280 185, 240 195, 215 190" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Hand fist & grip position (Above navel, below ribs) -->
  <circle cx="215" cy="190" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Force direction arrow: Inward and Upward! -->
  <g transform="translate(215, 190)">
    <path d="M 20 20 L -15 -15" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-25,-25 -10,-28 -28,-10" fill="#ef4444"/>
  </g>

  <!-- Explanatory Labels -->
  <rect x="18" y="16" width="160" height="52" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="98" y="36" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Толчок: ВВЕРХ и ВГЛУБЬ</text>
  <text x="98" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">5 толчков животом</text>

  <rect x="230" y="16" width="155" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="307" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Точка: Выше пупка</text>
  <text x="307" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ниже мечевидного отростка</text>

  <!-- Bottom tip -->
  <rect x="30" y="258" width="340" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="276" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Чередуйте: 5 ударов между лопаток ➔ 5 толчков Геймлиха</text>
</svg>
