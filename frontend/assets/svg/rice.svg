<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgRice)"/>

  <!-- 4-panel grid for R - I - C - E -->
  <line x1="200" y1="20" x2="200" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="20" y1="150" x2="380" y2="150" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- R: Rest -->
  <rect x="25" y="25" width="165" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="65" cy="65" r="16" fill="#0284c7"/>
  <text x="65" y="71" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">R</text>
  <text x="95" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">REST</text>
  <text x="95" y="75" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Покой</text>
  <text x="35" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Не нагружать сустав</text>
  <text x="35" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Иммобилизация</text>

  <!-- I: Ice -->
  <rect x="210" y="25" width="165" height="115" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="250" cy="65" r="16" fill="#0891b2"/>
  <text x="250" y="71" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">I</text>
  <text x="280" y="60" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ICE</text>
  <text x="280" y="75" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Холод</text>
  <text x="220" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">15-20 мин через ткань</text>
  <text x="220" y="120" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">❌ Не греть! (первые 48 ч)</text>

  <!-- C: Compression -->
  <rect x="25" y="160" width="165" height="115" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="65" cy="200" r="16" fill="#d97706"/>
  <text x="65" y="206" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">C</text>
  <text x="95" y="195" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">COMPRESS</text>
  <text x="95" y="210" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Компрессия</text>
  <text x="35" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Эластичный бинт</text>
  <text x="35" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Без передавливания</text>

  <!-- E: Elevation -->
  <rect x="210" y="160" width="165" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <circle cx="250" cy="200" r="16" fill="#059669"/>
  <text x="250" y="206" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">E</text>
  <text x="280" y="195" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ELEVATE</text>
  <text x="280" y="210" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Приподнять</text>
  <text x="220" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Выше уровня сердца</text>
  <text x="220" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Снимает отек и пульсацию</text>
</svg>
