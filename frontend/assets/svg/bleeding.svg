<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBleed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgBleed)"/>

  <!-- Limb (Arm/Leg) horizontal -->
  <path d="M 40 120 L 360 120 C 375 140, 375 170, 360 190 L 40 190 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Wound site with blood spurting/pooling -->
  <ellipse cx="280" cy="155" rx="18" ry="12" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <path d="M 280 155 Q 290 135 305 138 Q 300 155 285 160" fill="#dc2626"/>

  <!-- Tourniquet / Жгут applied 5-7 cm ABOVE the wound -->
  <rect x="150" y="105" width="24" height="100" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <!-- Windlass / палочка-закрутка -->
  <line x1="140" y1="130" x2="185" y2="170" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Distance marker: 5-7 cm above wound -->
  <line x1="175" y1="85" x2="280" y2="85" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="175" cy="85" r="3" fill="#38bdf8"/>
  <circle cx="280" cy="85" r="3" fill="#38bdf8"/>
  <text x="227" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5 – 7 см выше раны</text>

  <!-- Time Tag on Tourniquet -->
  <rect x="70" y="215" width="130" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="233" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ЗАПИСАТЬ ВРЕМЯ!</text>
  <text x="135" y="249" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">14:35 (макс 60 мин)</text>

  <!-- Direct Pressure Bandage callout -->
  <rect x="225" y="215" width="150" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="233" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Прямое давление</text>
  <text x="300" y="249" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Давящая повязка на рану</text>

  <!-- Header -->
  <rect x="20" y="16" width="360" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="37" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Кровотечение: Давление на рану ➔ Жгут при артериальном</text>
</svg>
