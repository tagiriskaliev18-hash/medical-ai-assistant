<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgFast)"/>

  <!-- Grid: 4 quadrants -->
  <line x1="200" y1="20" x2="200" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="20" y1="150" x2="380" y2="150" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Quadrant 1: Face (Улыбка) -->
  <rect x="25" y="25" width="165" height="115" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <circle cx="70" cy="75" r="28" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="62" cy="70" r="3" fill="#ffffff"/>
  <circle cx="78" cy="70" r="3" fill="#ffffff"/>
  <!-- Asymmetric smile: one side drooping -->
  <path d="M 58 88 Q 70 94 76 84" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="110" y="55" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">У — Улыбка</text>
  <text x="110" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Асимметрия</text>
  <text x="110" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Угол рта опущен</text>

  <!-- Quadrant 2: Arms (Движение) -->
  <rect x="210" y="25" width="165" height="115" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <!-- Figure with one raised arm and one dropping arm -->
  <circle cx="255" cy="55" r="14" fill="#475569"/>
  <line x1="255" y1="70" x2="255" y2="110" stroke="#94a3b8" stroke-width="4"/>
  <!-- Normal arm (straight horizontal) -->
  <line x1="255" y1="80" x2="230" y2="80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Weak arm (falling down) -->
  <line x1="255" y1="80" x2="280" y2="105" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M 285 95 L 285 112" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="55" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Д — Движение</text>
  <text x="298" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Слабость руки</text>
  <text x="298" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Не удерживает</text>

  <!-- Quadrant 3: Speech (Артикуляция) -->
  <rect x="25" y="160" width="165" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <!-- Speech bubble with slurred dots -->
  <path d="M 45 190 Q 40 190 40 205 Q 40 220 55 220 L 55 235 L 70 220 L 95 220 Q 105 220 105 205 Q 105 190 95 190 Z" fill="#0284c7"/>
  <text x="72" y="210" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">. . . ?</text>
  <text x="115" y="190" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">А — Артикуляция</text>
  <text x="115" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Речь невнятная</text>
  <text x="115" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">«Каша во рту»</text>

  <!-- Quadrant 4: Time / Call 103 (Решение) -->
  <rect x="210" y="160" width="165" height="115" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2"/>
  <circle cx="255" cy="210" r="24" fill="#ef4444"/>
  <!-- Phone icon inside circle -->
  <path d="M 248 198 C 248 198, 252 205, 255 208 C 258 211, 264 213, 264 213 L 260 220 C 256 220, 243 214, 242 201 Z" fill="#ffffff"/>
  <text x="295" y="195" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Р — Решение</text>
  <text x="295" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">ЗВОНИТЕ 103</text>
  <text x="295" y="235" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">Окно 4.5 часа!</text>
</svg>
