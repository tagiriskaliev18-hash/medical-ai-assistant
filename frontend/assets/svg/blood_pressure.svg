<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgBp)"/>

  <!-- Table surface -->
  <line x1="20" y1="230" x2="380" y2="230" stroke="#475569" stroke-width="3"/>

  <!-- Arm resting on table at heart level -->
  <path d="M 40 100 C 60 110, 80 140, 110 160 L 160 170 L 290 225 L 340 225" stroke="#334155" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- BP Cuff on Upper Arm (2-3 cm above elbow fold) -->
  <rect x="95" y="125" width="45" height="50" rx="6" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" transform="rotate(-25, 117, 150)"/>
  
  <!-- Distance marker: 2-3 cm above elbow -->
  <line x1="165" y1="135" x2="165" y2="165" stroke="#f59e0b" stroke-width="2"/>
  <text x="175" y="152" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2–3 см выше сгиба</text>

  <!-- Digital Tonometer Monitor on Table -->
  <rect x="250" y="140" width="110" height="85" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="260" y="150" width="90" height="40" rx="4" fill="#0284c7" fill-opacity="0.2"/>
  <text x="270" y="172" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">120/80</text>
  <text x="325" y="186" fill="#94a3b8" font-family="monospace" font-size="10">SYS/DIA</text>
  <!-- Pulse readout on monitor -->
  <text x="270" y="210" fill="#f87171" font-family="monospace" font-size="12">♥ 72</text>
  <!-- Rubber hose connecting cuff to monitor -->
  <path d="M 140 165 C 180 200, 210 215, 250 200" stroke="#64748b" stroke-width="3" fill="none"/>

  <!-- Rules Card on top -->
  <rect x="20" y="15" width="360" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="35" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">КЛИНИЧЕСКИЕ ПРАВИЛА ИЗМЕРЕНИЯ:</text>
  <text x="35" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">✓ 5 минут отдыха в покое перед измерением, ноги не скрещивать</text>
  <text x="35" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">✓ Манжета на уровне сердца, ВО ВРЕМЯ ЗАМЕРА НЕ ГОВОРИТЬ!</text>
  
  <rect x="20" y="255" width="360" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Норма: менее 130/85 мм рт. ст. • Криз: выше 180/120 (вызов 103!)</text>
</svg>
