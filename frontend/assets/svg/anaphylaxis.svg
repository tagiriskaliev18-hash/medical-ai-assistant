<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgAna)"/>

  <!-- Thigh (outer anterolateral surface) -->
  <path d="M 60 190 C 80 150, 160 130, 280 135 C 330 140, 360 170, 370 210 L 60 210 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Injection zone highlight (Middle third of outer thigh) -->
  <rect x="170" y="142" width="70" height="45" rx="6" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Epinephrine Auto-Injector (EpiPen) held at 90° angle -->
  <g transform="translate(205, 70)">
    <!-- Pen body -->
    <rect x="-12" y="0" width="24" height="70" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Safety cap / trigger -->
    <rect x="-8" y="-12" width="16" height="12" rx="2" fill="#0284c7"/>
    <!-- Needle tip end pressing into thigh -->
    <polygon points="-6,70 6,70 0,78" fill="#e2e8f0"/>
    <!-- Label -->
    <text x="0" y="40" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle" transform="rotate(-90, 0, 40)">ADRENALINE</text>
  </g>

  <!-- Angle marker 90° -->
  <path d="M 225 142 L 235 142 L 235 132" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="130" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">90°</text>

  <!-- Labels -->
  <rect x="20" y="18" width="165" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="102" y="36" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">АДРЕНАЛИН 1-Я ЛИНИЯ</text>
  <text x="102" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0.3 - 0.5 мг в/м в бедро</text>

  <rect x="250" y="18" width="135" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="317" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">УДЕРЖИВАТЬ 10 СЕК</text>
  <text x="317" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Можно через одежду!</text>

  <!-- Patient position tip -->
  <rect x="20" y="248" width="360" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="271" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Положение: лежа на спине с приподнятыми ногами (30-40 см)!</text>
</svg>
