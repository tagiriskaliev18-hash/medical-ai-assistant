<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCpr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgCpr)"/>
  
  <!-- Torso Outline -->
  <path d="M 60 260 C 70 190, 100 160, 200 160 C 300 160, 330 190, 340 260 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  
  <!-- Sternum (Center of chest) -->
  <rect x="194" y="165" width="12" height="65" rx="5" fill="#f87171" opacity="0.6"/>
  <circle cx="200" cy="195" r="16" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 2"/>
  <circle cx="200" cy="195" r="4" fill="#ffffff"/>

  <!-- Arms / Locked Elbows (Straight down from top) -->
  <!-- Left arm -->
  <path d="M 175 20 L 175 120 L 185 165 L 195 165 L 188 120 L 188 20 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <!-- Right arm -->
  <path d="M 225 20 L 225 120 L 215 165 L 205 165 L 212 120 L 212 20 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>

  <!-- Hands Clasp / Interlocked fingers -->
  <ellipse cx="200" cy="175" rx="28" ry="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 185 170 Q 200 162 215 170 Q 200 178 185 170" fill="#bae6fd"/>

  <!-- Force compression vector arrow -->
  <g transform="translate(200, 100)">
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#f59e0b" stroke-width="4"/>
    <polygon points="-8,20 8,20 0,35" fill="#f59e0b"/>
  </g>

  <!-- Indicator badges -->
  <rect x="250" y="80" width="135" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="317" y="98" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Глубина 5-6 см</text>
  <text x="317" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Локти прямые 90°</text>

  <rect x="15" y="80" width="135" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="82" y="98" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100-120 в мин</text>
  <text x="82" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ритм 30:2 (или компрессии)</text>

  <!-- Bottom Notice -->
  <rect x="60" y="255" width="280" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="275" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Твердая ровная поверхность • Центр грудины</text>
</svg>
