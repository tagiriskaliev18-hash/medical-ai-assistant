<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="1%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- ECG Grid Line -->
  <path d="M 20 250 L 80 250 L 95 235 L 110 265 L 125 210 L 140 280 L 155 250 L 380 250" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6"/>
  
  <!-- Forearm & Wrist -->
  <path d="M 40 180 C 80 170, 160 165, 230 160 C 270 157, 310 145, 340 130 C 355 122, 365 130, 360 145 C 345 185, 310 195, 260 200 C 190 205, 100 215, 40 220 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Thumb & Fingers outline of the resting hand -->
  <path d="M 335 132 C 355 110, 375 115, 385 130 C 375 145, 355 150, 340 150 Z" fill="#475569"/>
  
  <!-- Examining Hand (2 fingers on radial artery) -->
  <!-- Index and Middle Finger -->
  <path d="M 215 60 C 215 90, 220 125, 220 155 C 220 160, 228 160, 230 155 C 235 125, 240 90, 240 60 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <path d="M 235 60 C 235 90, 242 125, 245 155 C 245 160, 253 160, 255 155 C 258 125, 260 90, 258 60 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Hand body pressing -->
  <path d="M 205 60 C 205 30, 270 30, 270 60 C 270 70, 275 80, 275 90 C 265 95, 210 95, 205 60 Z" fill="#0284c7" opacity="0.8"/>
  
  <!-- Pulse pulsation circles at contact point -->
  <circle cx="235" cy="158" r="8" fill="#ef4444" opacity="0.8">
    <animate attributeName="r" values="6;16;6" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="235" cy="158" r="4" fill="#ffffff"/>
  
  <!-- Anatomical Target Indicator -->
  <path d="M 235 185 L 235 220" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="175" y="215" width="120" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="235" y="232" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Лучевая артерия</text>

  <!-- Legend / Guidelines Header -->
  <rect x="16" y="14" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="26" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2 пальца (НЕ большой!)</text>

  <rect x="270" y="14" width="115" height="34" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="327" y="36" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">60-90 уд/мин</text>
</svg>
